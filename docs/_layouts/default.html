<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Katrina Brown">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    <main class="page">
        {% unless page.url == '/' %}
        <header class="subpage-header">
            <a class="subpage-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <a class="subpage-back" href="{{ '/' | relative_url }}">&larr; Home</a>
        </header>
        {% endunless %}

        {{ content }}

        <footer class="site-footer">
            Design inspired by <a href="https://aneeshers.github.io/">Aneesh Muppidi</a> and <a href="https://jonbarron.info">Jon Barron</a>.
        </footer>
    </main>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
